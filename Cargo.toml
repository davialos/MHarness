[package]
name = "mharness"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight cross-platform agent harness that drives your already-authenticated agent CLIs (Claude Code, Codex, Gemini, ...)"
license = "MIT"
repository = "https://github.com/davialos/MHarness"
readme = "README.md"
keywords = ["agent", "claude", "cli", "llm", "harness"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mharness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
